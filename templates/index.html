<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Guidance & Team Portal | Academic Department Portal</title>

  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Icons via CDN (SRI removed for universal compatibility) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Socket.IO Client CDN -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Application Stylesheets (Original modular CSS preserved) -->
  <link rel="stylesheet" href="/static/css/style.css?v=2" />
  <link rel="stylesheet" href="/static/css/components.css?v=2" />
  <link rel="stylesheet" href="/static/css/responsive.css?v=2" />
</head>
<body>
  <div id="app">
    <!-- Auth Container (Visible immediately by default - Zero Blank Screen) -->
    <div id="auth-container">
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #EEF2FF 0%, #F5F3FF 50%, #F7F8FC 100%); padding: 24px;">
        <div class="card" style="width: 100%; max-width: 460px; padding: 36px; box-shadow: var(--shadow-modal); border-radius: 24px;">
          <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 64px; height: 64px; border-radius: 16px; background-color: var(--color-primary-light); color: var(--color-primary); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px;">
              <i class="fa-solid fa-graduation-cap"></i>
            </div>
            <h2 style="font-size: 24px; font-weight: 800; color: var(--text-primary); margin: 0 0 6px 0;">
              Academic Portal
            </h2>
            <p style="font-size: 14px; color: var(--text-secondary); margin: 0;">
              Project Guidance & Capstone Team Management
            </p>
          </div>

          <div id="login-error-alert" style="display: none; background-color: var(--color-danger-light); color: var(--color-danger); padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 20px; align-items: center; gap: 10px;">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span id="login-error-text"></span>
          </div>

          <form id="login-form" style="display: flex; flex-direction: column; gap: 16px;">
            <div>
              <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;">
                Email Address
              </label>
              <div style="position: relative;">
                <i class="fa-regular fa-envelope" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
                <input
                  id="login-email"
                  type="email"
                  required
                  placeholder="name@college.edu or name@student.edu"
                  style="width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 14px; outline: none; transition: border-color 0.2s;"
                />
              </div>
            </div>

            <div>
              <label style="display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px;">
                Password
              </label>
              <div style="position: relative;">
                <i class="fa-solid fa-lock" style="position: absolute; left: 14px; top: 14px; color: var(--text-muted);"></i>
                <input
                  id="login-password"
                  type="password"
                  required
                  placeholder="••••••••"
                  style="width: 100%; padding: 12px 14px 12px 40px; border-radius: 10px; border: 1px solid var(--border-color); font-size: 14px; outline: none;"
                />
              </div>
            </div>

            <button
              id="btn-login-submit"
              type="submit"
              style="margin-top: 8px; background-color: var(--color-primary); color: #fff; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 14px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(67, 56, 202, 0.25);"
            >
              <i class="fa-solid fa-arrow-right-to-bracket"></i>
              <span>Sign In to Portal</span>
            </button>
          </form>

          <!-- Quick Demo Logins Box -->
          <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border-light);">
            <div style="font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; text-align: center;">
              Quick 1-Click Demo Logins
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;">
              <button
                id="btn-fill-hod"
                type="button"
                style="padding: 8px 6px; border-radius: 8px; border: 1px solid #E0E7FF; background-color: #EEF2FF; color: #4338CA; font-size: 11px; font-weight: 700; cursor: pointer;"
              >
                HOD (Admin)
              </button>
              <button
                id="btn-fill-fac"
                type="button"
                style="padding: 8px 6px; border-radius: 8px; border: 1px solid #EDE9FE; background-color: #F5F3FF; color: #7C3AED; font-size: 11px; font-weight: 700; cursor: pointer;"
              >
                Faculty Mentor
              </button>
              <button
                id="btn-fill-std"
                type="button"
                style="padding: 8px 6px; border-radius: 8px; border: 1px solid #DCFCE7; background-color: #F0FDF4; color: #16A34A; font-size: 11px; font-weight: 700; cursor: pointer;"
              >
                Student
              </button>
            </div>
          </div>

          <div style="margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-secondary);">
            New student or faculty?
            <button
              id="link-go-to-signup"
              type="button"
              style="color: var(--color-primary); font-weight: 700; border: none; background: none; cursor: pointer;"
            >
              Create an Account
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Authenticated App Shell -->
    <div id="portal-shell" class="app-wrapper" style="display: none;">
      <!-- Mobile Drawer Overlay -->
      <div id="mobile-overlay" class="mobile-drawer-overlay" style="display: none;"></div>

      <!-- Real-Time Toast Notification -->
      <div id="toast-container"></div>

      <!-- Sidebar -->
      <aside id="main-sidebar" class="sidebar">
        <!-- Brand Header -->
        <div class="sidebar-brand-wrapper">
          <div class="brand-icon-shield">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div class="brand-text-block">
            <h1>ProjectPortal</h1>
            <span>CS Department SaaS</span>
          </div>
        </div>

        <!-- Scrollable Navigation Items -->
        <div class="sidebar-scroll-content" id="sidebar-nav-container"></div>

        <!-- User Footer -->
        <div class="sidebar-footer-user">
          <div class="footer-user-info">
            <img id="sidebar-user-avatar" src="" alt="User Avatar" class="avatar avatar-sm current-user-avatar" />
            <div class="footer-user-details">
              <div id="sidebar-user-name" class="user-name current-user-name"></div>
              <div id="sidebar-user-role" class="user-role current-user-role" style="text-transform: capitalize;"></div>
            </div>
          </div>
          <button id="btn-sidebar-signout" class="btn-icon-subtle" title="Sign out of portal" style="width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">
            <i class="fa-solid fa-arrow-right-from-bracket text-muted"></i>
          </button>
        </div>
      </aside>

      <!-- Main Layout -->
      <div class="app-main-layout">
        <!-- Topbar -->
        <header class="topbar">
          <div class="topbar-left">
            <button id="btn-toggle-mobile-nav" class="btn-hamburger" title="Toggle Navigation" style="cursor: pointer;">
              <i class="fa-solid fa-bars"></i>
            </button>
            <div class="topbar-title-block">
              <h2 id="topbar-title" class="topbar-title">Academic Portal</h2>
              <div class="topbar-breadcrumb">
                <i class="fa-solid fa-house text-xs"></i> <span>/</span> <span id="breadcrumb-role">role</span> <span>/</span> <span id="breadcrumb-view">dashboard</span>
              </div>
            </div>
          </div>

          <div class="topbar-right">
            <!-- Quick Demo Persona Switcher -->
            <div class="role-switcher-wrap" title="Switch instantly between HOD, Faculty, and Student demo accounts">
              <i class="fa-solid fa-user-gear text-indigo text-xs"></i>
              <label for="topbar-role-select">Demo Persona:</label>
              <select id="topbar-role-select" class="role-select-native">
                <option value="hod">HOD (Dr. Vance)</option>
                <option value="faculty">Faculty (Dr. Jenkins)</option>
                <option value="student">Student (Alex Chen)</option>
              </select>
            </div>

            <!-- Notifications Bell -->
            <div style="position: relative;">
              <button id="btn-topbar-notif" class="topbar-action-btn" title="Notifications">
                <i class="fa-regular fa-bell"></i>
                <span id="topbar-notif-badge" class="notif-badge-dot" style="display: none;">0</span>
              </button>

              <div id="topbar-notif-menu" class="notif-dropdown" style="display: none;">
                <div class="notif-dropdown-header">
                  <div>
                    <h4 class="font-bold text-sm">Notifications</h4>
                    <span id="topbar-notif-subtitle" class="text-xs text-muted">0 unread alert(s)</span>
                  </div>
                  <button id="btn-topbar-mark-all-read" class="text-xs text-indigo font-semibold hover:underline" style="display: none;">
                    Mark all read
                  </button>
                </div>
                <div id="topbar-notif-items" class="notif-dropdown-list" style="max-height: 300px; overflow-y: auto;">
                  <div class="p-4 text-center text-xs text-muted">No notifications yet.</div>
                </div>
                <div class="p-3 text-center border-t border-light bg-subtle">
                  <button id="btn-topbar-view-all-notifs" class="text-xs text-indigo font-bold hover:underline">
                    View All Notifications <i class="fa-solid fa-arrow-right"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- User Profile Pill -->
            <div style="position: relative;">
              <div id="btn-topbar-profile" class="topbar-user-profile" style="cursor: pointer;">
                <img id="topbar-user-avatar" src="" alt="Avatar" class="avatar avatar-sm current-user-avatar" />
                <div class="line-tight text-left" style="display: flex; flex-direction: column;">
                  <span id="topbar-user-name" class="text-xs font-bold block current-user-name"></span>
                  <span id="topbar-user-role" class="text-xs text-muted block current-user-role" style="text-transform: capitalize;"></span>
                </div>
                <i class="fa-solid fa-chevron-down text-xs text-muted ml-1"></i>
              </div>

              <div id="topbar-profile-dropdown" class="dropdown-menu" style="display: none; position: absolute; right: 0; top: 115%; width: 200px; background: #fff; border-radius: 12px; box-shadow: var(--shadow-card); border: 1px solid var(--border-color); padding: 8px 0; z-index: 999;">
                <div style="padding: 8px 16px; border-bottom: 1px solid var(--border-light);">
                  <div id="dropdown-user-name" style="font-size: 13px; font-weight: bold;"></div>
                  <div id="dropdown-user-email" style="font-size: 11px; color: var(--text-secondary);"></div>
                </div>
                <button id="btn-dropdown-signout" style="width: 100%; text-align: left; padding: 8px 16px; font-size: 13px; color: var(--color-danger); display: flex; align-items: center; gap: 8px;">
                  <i class="fa-solid fa-arrow-right-from-bracket"></i> Sign Out
                </button>
              </div>
            </div>
          </div>
        </header>

        <!-- Main Content View Area -->
        <main id="main-content" class="content-view-container" style="padding: 24px 32px;"></main>
      </div>
    </div>

    <!-- Modals Container -->
    <div id="modal-container"></div>
  </div>

  <!-- Immediate Quick-Fill Helper Script -->
  <script>
    (function() {
      function bindQuickDemo() {
        var email = document.getElementById('login-email');
        var pw = document.getElementById('login-password');
        var err = document.getElementById('login-error-alert');

        var bHod = document.getElementById('btn-fill-hod');
        var bFac = document.getElementById('btn-fill-fac');
        var bStd = document.getElementById('btn-fill-std');

        if (bHod) {
          bHod.onclick = function() {
            if (email) email.value = 'hod.cs@college.edu';
            if (pw) pw.value = 'HodPass@2026';
            if (err) err.style.display = 'none';
          };
        }
        if (bFac) {
          bFac.onclick = function() {
            if (email) email.value = 'sarah.jenkins@college.edu';
            if (pw) pw.value = 'Password@123';
            if (err) err.style.display = 'none';
          };
        }
        if (bStd) {
          bStd.onclick = function() {
            if (email) email.value = 'alex.chen@student.edu';
            if (pw) pw.value = 'Password@123';
            if (err) err.style.display = 'none';
          };
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bindQuickDemo);
      } else {
        bindQuickDemo();
      }
    })();
  </script>

  <!-- Vanilla JavaScript Application Modules with Cache Buster -->
  <script type="module" src="/static/js/app.js?v=20261024_3"></script>
</body>
</html>
