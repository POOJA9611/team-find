{% extends "base.html" %}

{% block title %}Sign In - Student Project Finder{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto 0 auto;">
  <div class="card" style="position: relative; padding: 32px 28px;">
    <!-- Discreet Admin Access Icon -->
    <a href="{{ url_for('admin_login') }}"
       aria-label="Portal Entry"
       style="position: absolute; top: 18px; right: 18px; color: var(--color-text-secondary); opacity: 0.35; display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; text-decoration: none; border-radius: 4px; transition: opacity 0.2s ease;"
       onmouseover="this.style.opacity='0.65';"
       onmouseout="this.style.opacity='0.35';">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
      </svg>
    </a>

    <div style="text-align: center; margin-bottom: 24px;">
      <h1>Sign In to Portal</h1>
      <p class="subtitle">Access your projects, teammates, and originality checks</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="name@college.edu or name@student.edu">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••">
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">Sign In</button>
      </div>
    </form>

    <div style="margin-top: 14px; text-align: center;">
      <a href="{{ url_for('check_registration_status', email=pending_email or '') }}" style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--color-primary); font-weight: 600; text-decoration: none;">
        <span>&#x1F50D;</span>
        <span>Check Registration Status</span>
      </a>
    </div>

    <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-border); text-align: center; font-size: 13px;">
      <span style="color: var(--color-text-secondary);">New student?</span>
      <a href="{{ url_for('register') }}" style="color: var(--color-primary); font-weight: 700; text-decoration: underline; margin-left: 4px;">
        Request an Account
      </a>
    </div>
  </div>
</div>
{% endblock %}
