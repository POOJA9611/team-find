{% extends "base.html" %}

{% block title %}Administrator Sign In - Student Project Finder{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 40px auto 0 auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #e0f2fe; color: var(--color-primary); margin-bottom: 12px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        </svg>
      </div>
      <h1 style="font-size: 22px; margin: 0 0 6px 0;">Administrator Portal</h1>
      <p class="subtitle" style="margin: 0;">Authorized administrator authentication</p>
    </div>

    <form method="POST" action="{{ url_for('admin_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-group">
        <label class="form-label" for="email">Administrator Email *</label>
        <input type="email" id="email" name="email" class="form-input" required placeholder="admin@college.edu" autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password *</label>
        <input type="password" id="password" name="password" class="form-input" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <div style="margin-top: 24px;">
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-weight: 700;">
          Authenticate as Administrator
        </button>
      </div>
    </form>

    <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--color-border); text-align: center; font-size: 13px;">
      <a href="{{ url_for('login') }}" style="color: var(--color-text-secondary); text-decoration: none;">
        &larr; Return to Student Portal
      </a>
    </div>
  </div>
</div>
{% endblock %}
